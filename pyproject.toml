[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openlens"
version = "0.1.0"
description = "A local ML project for exploring personal information consumption patterns"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["scikit-learn>=1.5,<2", "joblib>=1.3", "plotly>=6,<8", "sentence-transformers>=5"]

[project.scripts]
openlens = "openlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
